<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Выгрузка отчетов</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Навигация (будет обновлена) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-danger">
      <div class="container">
        <a class="navbar-brand" href="index.html">
          <i class="bi bi-house-door me-2"></i>Система управления
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="system-admin.html">
                <i class="bi bi-speedometer2 me-1"></i>Панель управления
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="system-hotels.html">
                <i class="bi bi-house-door me-1"></i>Отели
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="system-users.html">
                <i class="bi bi-people me-1"></i>Пользователи
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="system-reports.html">
                <i class="bi bi-file-earmark-arrow-down me-1"></i>Выгрузка
                отчетов
              </a>
            </li>
            <li class="nav-item d-none" id="user-info-item">
              <span class="nav-link">
                <i class="bi bi-person-circle"></i>
                <span id="user-name"></span>
              </span>
            </li>
            <li class="nav-item d-none" id="logout-item">
              <a class="nav-link" href="#" id="nav-logout">
                <i class="bi bi-box-arrow-right me-1"></i>Выход
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Основной контент -->
    <div class="container my-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>
          <i class="bi bi-file-earmark-arrow-down-fill me-2"></i>Выгрузка
          отчетов
        </h1>
      </div>

      <div class="card">
        <div class="card-body">
          <div class="row g-4">
            <div class="col-md-6">
              <label class="form-label fw-bold"
                >Выберите таблицы для выгрузки</label
              >
              <div class="form-check">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="table-hotels"
                  value="hotels"
                />
                <label class="form-check-label" for="table-hotels">
                  Отели
                </label>
              </div>
              <div class="form-check">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="table-users"
                  value="users"
                />
                <label class="form-check-label" for="table-users">
                  Пользователи
                </label>
              </div>
              <div class="form-check">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="table-rooms"
                  value="rooms"
                />
                <label class="form-check-label" for="table-rooms">
                  Номера
                </label>
              </div>
              <div class="form-check">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="table-bookings"
                  value="bookings"
                />
                <label class="form-check-label" for="table-bookings">
                  Бронирования
                </label>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-check mt-4">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="all-tables"
                  checked
                />
                <label class="form-check-label fw-bold" for="all-tables">
                  Все таблицы сразу
                </label>
              </div>
              <div class="mt-3">
                <label class="form-label">Формат файла</label>
                <select class="form-select" id="file-format">
                  <option value="excel">Excel (.xlsx)</option>
                  <option value="csv">CSV</option>
                </select>
              </div>
            </div>
          </div>
          <hr class="my-4" />
          <div class="text-center">
            <button class="btn btn-success btn-lg" id="generate-report">
              <i class="bi bi-download me-2"></i>Сформировать отчет
            </button>
            <div id="report-loading" class="mt-3 d-none">
              <div class="spinner-border text-success" role="status">
                <span class="visually-hidden">Формирование...</span>
              </div>
              <p class="mt-2 text-muted">Формирование отчета...</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const user = Auth.getCurrentUser();
        if (!user) {
          window.location.href = "index.html";
          return;
        }

        document.getElementById("user-info-item").classList.remove("d-none");
        document.getElementById("logout-item").classList.remove("d-none");
        document.getElementById(
          "user-name"
        ).textContent = `${user.first_name} ${user.last_name}`;

        if (user.role === "system_admin") {
          document.getElementById("admin-nav").classList.remove("d-none");
        }

        document.getElementById("nav-logout").addEventListener("click", (e) => {
          e.preventDefault();
          Auth.logout();
        });

        // Логика чекбоксов
        document
          .getElementById("all-tables")
          .addEventListener("change", (e) => {
            const checkboxes = document.querySelectorAll(
              'input[id^="table-"]:not(#all-tables)'
            );
            checkboxes.forEach((cb) => (cb.disabled = e.target.checked));
            if (e.target.checked) {
              checkboxes.forEach((cb) => (cb.checked = false));
            }
          });

        // Генерация отчета (заглушка)
        document
          .getElementById("generate-report")
          .addEventListener("click", async () => {
            const btn = document.getElementById("generate-report");
            const loading = document.getElementById("report-loading");

            btn.disabled = true;
            loading.classList.remove("d-none");

            // TODO: Вызов API /api/export/{format}
            setTimeout(() => {
              alert("Отчет сформирован! (заглушка для backend API)");
              btn.disabled = false;
              loading.classList.add("d-none");
            }, 2000);
          });
      });
    </script>
  </body>
</html>
